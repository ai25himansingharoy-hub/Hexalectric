<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HEXALECTRIC | Onboard Bus Camera Intelligence Node</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <style>
    :root,
    [data-theme="light"] {
      --bg-dark: #f2f0eb;
      --card-bg: #ffffff;
      --header-bg: #1E3932;
      --primary: #00754A;
      --accent-danger: #e11d48;
      --accent-success: #00754A;
      --text: rgba(0, 0, 0, 0.87);
      --text-muted: rgba(0, 0, 0, 0.58);
      --border: rgba(0, 0, 0, 0.12);
    }

    [data-theme="dark"] {
      --bg-dark: #0b1713;
      --card-bg: #162b24;
      --header-bg: #070e0c;
      --primary: #10b981;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --text: rgba(255, 255, 255, 0.95);
      --text-muted: rgba(255, 255, 255, 0.70);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      letter-spacing: -0.01em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    header {
      padding: 12px 16px;
      background: var(--header-bg);
      color: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-size: 1.5rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-success);
      box-shadow: 0 0 8px var(--accent-success);
    }

    .viewport-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 280px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video#webcam,
    img#previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas#overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .hud-pill {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .alert-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(244, 63, 94, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.5);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .alert-banner.active {
      transform: translateX(-50%) translateY(0);
    }

    .notice-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #93c5fd;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .controls-panel {
      padding: 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      /* 50px full-pill radius */
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn:active {
      transform: scale(0.95) !important;
    }

    .btn-primary {
      background: #00754A;
      color: #fff;
      border: 1px solid #00754A;
      box-shadow: 0 4px 15px rgba(0, 117, 74, 0.4);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .input-group label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <span class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="2" />
          <path d="M4 11h16" />
          <circle cx="7.5" cy="15.5" r="1.5" />
          <circle cx="16.5" cy="15.5" r="1.5" />
          <path d="M6 19v2" />
          <path d="M18 19v2" />
        </svg>
      </span>
      <div>
        <div class="brand-title">HEXALECTRIC</div>
        <div style="font-size: 0.68rem; color: var(--text-muted);">Onboard Bus Camera Sensor Node</div>
      </div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span>READY</span>
    </div>
  </header>

  <div class="viewport-container">
    <video id="webcam" autoplay playsinline muted></video>
    <img id="previewImg" style="display:none;" alt="Snapshot Preview">
    <canvas id="overlay"></canvas>

    <div class="hud-overlay">
      <div class="hud-pill" id="gpsHud">GPS: Acquiring...</div>
      <div class="hud-pill" id="fpsHud">STATUS: READY</div>
    </div>

    <div id="alertBanner" class="alert-banner">
      <span id="alertText">POTHOLE DETECTED! (91%)</span>
    </div>
  </div>

  <div class="controls-panel">

    <div id="securityNotice" class="notice-box" style="display: none;">
      <strong>Camera Permission Notice:</strong>
      <span>Browsers require HTTPS for live stream access. Use <b>"Capture & Scan Camera Frame"</b> below to capture and analyze road photos directly on any device.</span>
    </div>

    <!-- Live Stream Button -->
    <button id="btnToggleScanner" class="btn btn-primary" onclick="toggleScanner()">
      Start Live Camera Feed
    </button>

    <!-- Camera Photo Capture Button -->
    <button id="btnSnapPhoto" class="btn btn-outline" onclick="triggerNativeCamera()">
      Capture & Scan Camera Frame
    </button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleNativePhoto(event)">

    <div class="config-grid">
      <div class="input-group">
        <label for="backendUrl">AI Backend API Endpoint</label>
        <input type="text" id="backendUrl" value="" placeholder="Auto-configured" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false">
      </div>
      <div class="input-group">
        <label for="rfApiKey">YOLO AI Model Engine</label>
        <input type="text" id="rfApiKey" value="Active (SIH Pre-Configured)" readonly style="color: #10b981; font-weight: 700; cursor: default;">
      </div>
    </div>
  </div>

  <canvas id="captureCanvas" style="display: none;"></canvas>

  <script>
    let isScanning = false;
    let scanTimeout = null;
    let currentLat = 22.5521;
    let currentLng = 88.3518;
    let consecutiveErrors = 0;
    let video = document.getElementById('webcam');
    let previewImg = document.getElementById('previewImg');
    let overlay = document.getElementById('overlay');
    let ctx = overlay.getContext('2d');
    let captureCanvas = document.getElementById('captureCanvas');
    let captureCtx = captureCanvas.getContext('2d');

    // Auto-detect backend host address (Use origin domain dynamically on Render / Localhost)
    function sanitizeBackendUrlInput() {
      let host = window.location.origin;
      if (window.location.protocol === 'file:' || !window.location.origin || window.location.origin === 'null') {
        host = 'http://localhost:8000';
      }
      let currentVal = document.getElementById('backendUrl') ? document.getElementById('backendUrl').value.trim() : '';
      
      // Enforce host origin when on Render HTTPS or mobile cloud
      if (window.location.protocol === 'https:' || window.location.hostname.includes('onrender.com')) {
        if (!currentVal || currentVal.includes(':8000') || currentVal.startsWith('http:')) {
          currentVal = host;
        }
      }
      if (document.getElementById('backendUrl')) {
        document.getElementById('backendUrl').value = currentVal || host;
      }
    }

    let defaultHost = window.location.origin;
    if (window.location.protocol === 'file:' || !window.location.origin || window.location.origin === 'null') {
      defaultHost = 'http://localhost:8000';
    }

    window.addEventListener('pageshow', sanitizeBackendUrlInput);
    window.addEventListener('DOMContentLoaded', sanitizeBackendUrlInput);

    // Check if insecure HTTP IP origin
    if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      const notice = document.getElementById('securityNotice');
      if (notice) notice.style.display = 'flex';
    }

    // Initialize Camera Feed with autoplay compatibility
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        previewImg.style.display = 'none';
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth || 640;
          overlay.height = video.videoHeight || 480;
        };
        await video.play().catch(() => {});
        document.getElementById('fpsHud').innerText = "STATUS: CAMERA READY";
      } catch (err) {
        console.warn("Live webcam access notice:", err.message);
        document.getElementById('fpsHud').innerText = "WEBCAM: READY (USE PHOTO SCAN BELOW)";
      }
    }

    // Initialize GPS Tracking
    function initGPS() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById('gpsHud').innerText = `GPS: ${currentLat.toFixed(4)}°N, ${currentLng.toFixed(4)}°E`;
          },
          (err) => {
            console.warn("GPS Warning:", err.message);
            document.getElementById('gpsHud').innerText = `GPS: Sim (22.5521°N, 88.3518°E)`;
          },
          { enableHighAccuracy: true }
        );
      }
    }

    function triggerNativeCamera() {
      document.getElementById('fileInput').click();
    }

    // Process photo taken by phone camera with resolution optimization
    function handleNativePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          previewImg.src = img.src;
          previewImg.style.display = 'block';
          video.style.display = 'none';

          // Downscale high-resolution camera photo to optimal max 1024px width/height
          const maxDim = 1024;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          captureCanvas.width = w;
          captureCanvas.height = h;
          captureCtx.drawImage(img, 0, 0, w, h);

          // Convert to compressed Base64 JPEG (~100KB payload)
          const compressedBase64 = captureCanvas.toDataURL('image/jpeg', 0.80);

          setTimeout(() => {
            overlay.width = previewImg.clientWidth || w;
            overlay.height = previewImg.clientHeight || h;
            sendDetectionRequest(compressedBase64, w, h);
          }, 100);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Toggle Scanner Loop
    function toggleScanner() {
      const btn = document.getElementById('btnToggleScanner');
      const badge = document.getElementById('statusBadge');

      if (!isScanning) {
        isScanning = true;
        btn.innerText = "Pause Scanner Feed";
        btn.className = "btn btn-danger";
        badge.innerHTML = '<span class="status-dot"></span><span>SCANNING LIVE</span>';
        badge.style.background = 'rgba(244, 63, 94, 0.2)';
        badge.style.color = '#f43f5e';

        startScanLoop();
      } else {
        isScanning = false;
        btn.innerText = "Start Live Stream Scanner";
        btn.className = "btn btn-primary";
        badge.innerHTML = '<span class="status-dot"></span><span>PAUSED</span>';
        badge.style.background = 'rgba(255, 255, 255, 0.1)';
        badge.style.color = '#94a3b8';

        if (scanTimeout) clearTimeout(scanTimeout);
        ctx.clearRect(0, 0, overlay.width, overlay.height);
      }
    }

    let isProcessingFrame = false;

    function startScanLoop() {
      if (scanTimeout) clearTimeout(scanTimeout);

      async function step() {
        if (!isScanning) return;

        if (video.videoWidth && video.videoHeight && !isProcessingFrame) {
          const targetWidth = Math.min(video.videoWidth, 640);
          const targetHeight = Math.round(targetWidth * (video.videoHeight / video.videoWidth));

          captureCanvas.width = targetWidth;
          captureCanvas.height = targetHeight;
          captureCtx.drawImage(video, 0, 0, targetWidth, targetHeight);

          const base64Image = captureCanvas.toDataURL('image/jpeg', 0.55);
          await sendDetectionRequest(base64Image, targetWidth, targetHeight);
        } else if (!video.videoWidth) {
          initCamera();
        }

        if (isScanning) {
          scanTimeout = setTimeout(step, 350);
        }
      }

      step();
    }

    async function sendDetectionRequest(base64Image, sourceWidth = null, sourceHeight = null) {
      if (isProcessingFrame) return;
      isProcessingFrame = true;

      sanitizeBackendUrlInput();
      let backendUrl = document.getElementById('backendUrl') ? document.getElementById('backendUrl').value.trim() : defaultHost;
      if (!backendUrl || backendUrl === 'null' || backendUrl === 'undefined') {
        backendUrl = window.location.origin;
      }
      backendUrl = backendUrl.replace(/\/+$/, '');

      const apiKey = document.getElementById('rfApiKey') ? document.getElementById('rfApiKey').value.trim() : '';

      try {
        const startTime = Date.now();
        const response = await fetch(`${backendUrl}/api/detect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: base64Image,
            lat: currentLat,
            lng: currentLng,
            busId: "BUS_CAM_NODE_01",
            apiKey: apiKey || null,
            confidenceThreshold: 0.70,
            allowDemoFallback: true,
            imgWidth: sourceWidth,
            imgHeight: sourceHeight
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const latency = Date.now() - startTime;
        consecutiveErrors = 0;

        document.getElementById('fpsHud').innerText = `LATENCY: ${latency}ms | AI: ONLINE`;

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        const imgW = data.imgWidth || sourceWidth || overlay.width;
        const imgH = data.imgHeight || sourceHeight || overlay.height;

        const scaleX = overlay.width / (imgW || 1);
        const scaleY = overlay.height / (imgH || 1);

        if (data.detectedPotholes && data.detectedPotholes.length > 0) {
          triggerAlert(`POTHOLE DETECTED! (${(data.detectedPotholes[0].confidence * 100).toFixed(0)}%)`, false);

          // Draw Bounding Boxes on Overlay Canvas with proportional coordinate scaling
          data.detectedPotholes.forEach(evt => {
            const [x, y, w, h] = evt.bbox;

            const drawX = (x - w / 2) * scaleX;
            const drawY = (y - h / 2) * scaleY;
            const drawW = w * scaleX;
            const drawH = h * scaleY;

            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 4;
            ctx.strokeRect(drawX, drawY, drawW, drawH);

            ctx.fillStyle = 'rgba(244, 63, 94, 0.85)';
            ctx.fillRect(drawX, Math.max(0, drawY - 24), Math.max(130, drawW), 24);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px Inter, sans-serif';
            ctx.fillText(`Pothole ${(evt.confidence * 100).toFixed(0)}%`, drawX + 6, Math.max(16, drawY - 7));
          });
        } else {
          triggerAlert(`ROAD CLEAR: No Potholes Found`, true);
        }

      } catch (err) {
        console.warn("Backend detection retry:", err.message);
        consecutiveErrors++;
        if (consecutiveErrors >= 3) {
          document.getElementById('fpsHud').innerText = `CONNECTING TO CLOUD SERVER...`;
        }
      } finally {
        isProcessingFrame = false;
      }
    }

    function triggerAlert(msg, isSuccess = false) {
      const banner = document.getElementById('alertBanner');
      document.getElementById('alertText').innerText = msg;
      if (isSuccess) {
        banner.style.background = 'rgba(16, 185, 129, 0.95)';
        banner.style.boxShadow = '0 10px 25px rgba(16, 185, 129, 0.5)';
      } else {
        banner.style.background = 'rgba(244, 63, 94, 0.95)';
        banner.style.boxShadow = '0 10px 25px rgba(244, 63, 94, 0.5)';
      }
      banner.classList.add('active');

      setTimeout(() => {
        banner.classList.remove('active');
      }, 2500);
    }

    // On page load
    window.addEventListener('DOMContentLoaded', () => {
      sanitizeBackendUrlInput();
      initCamera();
      initGPS();
    });
  </script>
</body>

</html>
